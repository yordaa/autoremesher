name: windows-cli

on:
  push:
    branches:
      - codex/windows-parity
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test CLI contract
        run: ctest --test-dir build -C Release -V --output-on-failure
